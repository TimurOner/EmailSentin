<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Multi-line Text Box Input</title>
</head>
<body>
    <div class="sidebar left"></div>
    <div class="container">
        <h2>Enter Text:</h2>
        <form id="input_form">
            <textarea id="user_input" name="user_input" placeholder="Type here..."></textarea>
            <div class="dropdown-container">
                <div class="dropdown">
                    <h2>Choose Lexicon</h2>
                    <div class="styled-select">
                        <select id="lex_name" name="lex_name">
                            <option value="AFINN-96">AFINN-96</option>
                            <option value="AFINN-111">AFINN-111</option>
                            <option value="VADER">VADER</option>
                        </select>
                    </div>
                </div>
                <div class="dropdown">
                    <h2>Choose Method</h2>
                    <div class="styled-select">
                        <select id="select2" name="select2">
                            <option value="Rule Based">Rule Based</option>
                        </select>
                    </div>
                </div>
            </div>
            <button type="button" id="submit_button">Submit</button>
        </form>
        <h2>Output:</h2>
        <textarea id="output" readonly></textarea>
        <div id="user_input_display"></div> <!-- Element for displaying the colored text -->
    </div>
    <div class="sidebar right"></div>

    <script>
        document.getElementById('submit_button').addEventListener('click', function() {
            // Gather the form data
            const formData = new FormData(document.getElementById('input_form'));

            fetch('/process_input', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json()) // Expect a JSON response
            .then(data => {
                const score = data['score'];
                const introText = data['intro_text'];
                const bodyText = data['body_text'];

                const inputProcessed = processString(introText, bodyText);

                document.getElementById('output').value = score;
                document.getElementById('user_input_display').innerHTML = inputProcessed; // Display colored text
            })
            .catch(error => console.error('Error fetching data:', error));
        });

        function processString(firstStr, secondStr) {
            const redFirstStr = `<span style="color: red;">${firstStr}</span>`;
            const blueSecondStr = `<span style="color: blue;">${secondStr}</span>`;
            const processedStr = redFirstStr + blueSecondStr;

            return processedStr;
        }
    </script>
</body>
</html>
