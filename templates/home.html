<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-line Text Box Input</title>
    <style>
        /* Base styles */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            background-color: #f9f9f9; /* Light background for better contrast */
        }

        /* Textarea styles */
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        /* Dropdown container styles */
        .dropdown-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        /* Individual dropdown styles */
        .dropdown {
            flex: 1;
            margin-right: 10px;
        }

        .styled-select select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        /* Button styles */
        button[type="button"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-top: 10px;
            background-color: #449b47; /* Adjusted background color */
            color: white;
            border: none;
            border-radius: 5px; /* Rounded corners for the button */
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        button[type="button"]:hover {
            background-color: #357a34; /* Darker background on hover */
        }

        /* Output textarea styles */
        #output {
            height: 150px;
            border: 1px solid #ccc;
            background-color: #fff; /* Background color for the output box */
            padding: 10px; /* Ensure there's padding inside the output box */
            overflow-y: auto; /* Enable vertical scrolling if needed */
        }

        /* Heading styles */
        h2 {
            font-family: Arial, sans-serif;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Enter Text:</h2>
        <form id="input_form">
            <textarea id="user_input" name="user_input" placeholder="Type here..."></textarea>
            <div class="dropdown-container">
                <div class="dropdown">
                    <h2>Choose Lexicon</h2>
                    <div class="styled-select">
                        <select id="lex_name" name="lex_name">
                            <option value="AFINN-96">AFINN-96</option>
                            <option value="AFINN-111">AFINN-111</option>
                            <option value="VADER">VADER</option>
                        </select>
                    </div>
                </div>
                <div class="dropdown">
                    <h2>Choose Method</h2>
                    <div class="styled-select">
                        <select id="select2" name="select2">
                            <option value="Rule Based">Rule Based</option>
                        </select>
                    </div>
                </div>
            </div>
            <button type="button" id="submit_button">Submit</button>
        </form>
        <h2>Output:</h2>
        <textarea id="output" readonly></textarea>
    </div>

    <script>
        document.getElementById('submit_button').addEventListener('click', function() {
            // Gather the form data
            const formData = new FormData(document.getElementById('input_form'));

            fetch('/process_input', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text()) // Expect a text response
            .then(data => {
                // Update the HTML content dynamically
                document.getElementById('output').value = data;
            })
            .catch(error => console.error('Error fetching data:', error));
        });
    </script>
</body>
</html>
