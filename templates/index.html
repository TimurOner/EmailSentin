<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script type="text/javascript" src="{{ url_for('static', filename='script.js') }}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Multi-line Text Box Input</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
            <a class="navbar-brand" href="#">  Email Sentiment Analyzer</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item active">
                        <a class="nav-link" href="#"> Home <span class="sr-only">(current)</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>
    <div class="container-fluid">
        <div class="row">
            <div class="col-2 sidebar left">
                <!-- Left Sidebar Content -->
            </div>
            <div class="col-8">
                <h2>Enter Text:</h2>
                <form id="input_form">
                    <textarea class="form-control text_class" id="user_input" name="user_input" placeholder="Type here..."></textarea>
                    <div class="dropdown-container">
                        <div class="dropdown">
                            <h2>Choose Lexicon</h2>
                    
                            <div class="btn-group" role="group" aria-label="Lexicon selection">
                                <button type="button" class="btn btn-outline-secondary lexicon-btn" onclick="selectLexicon('AFINN-96')">AFINN-96</button>
                                <button type="button" class="btn btn-outline-secondary lexicon-btn" onclick="selectLexicon('AFINN-111')">AFINN-111</button>
                                <button type="button" class="btn btn-outline-secondary lexicon-btn" onclick="selectLexicon('VADER')">VADER</button>
                            </div>
                    
                            <input type="hidden" id="lex_name" name="lex_name" value="">
                        </div>
                    
                        <div class="dropdown">
                            <h2>Choose Analysis Type</h2>
                    
                            <div class="btn-group" role="group" aria-label="Method selection">
                                <button type="button" class="btn btn-outline-secondary method-btn" onclick="selectMethod('Positive-Negative')">Positive-Negative</button>
                                <button type="button" class="btn btn-outline-secondary method-btn" onclick="selectMethod('Formality Analysis')">Formality Analysis</button>
                            </div>
                    
                            <input type="hidden" id="method_name" name="method_name" value="">
                        </div>
                    </div>
                    
                    <button type="button" id="submit_button" class="btn btn-primary mt-3" onclick="submitForm()">Submit</button>
                </form>
                <h2>Output:</h2>
                <textarea class="form-control text_class" id="output" readonly></textarea>
    
                <div class="row">
                    <div class="col-md-8">
                        <h2>Parsed Email:</h2>
                        <div id="email_output" class="border p-3 mt-3">
                            <!-- Email output content goes here -->
                        </div>
                    </div>
                    <div class="col-md-4 legend-section">
                        <h4>Legend</h4>
                        <ul class="list-unstyled">
                            <li>
                                <span class="legend-color legend-red"></span> Greeting
                            </li>
                            <li>
                                <span class="legend-color legend-blue"></span> Body
                            </li>
                            <li>
                                <span class="legend-color legend-green"></span> Conclusion
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="col-2 sidebar right">
                <!-- Right Sidebar Content -->
            </div>
        </div>
    </div>
    
    </div>
    
    <!-- Footer placed outside the row -->
    <footer class="bg-light text-center py-3">
        <p class="mb-0">© 2024 Email Sentiment Analyzer. All rights reserved.</p>
    </footer>
    
   
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</html>
