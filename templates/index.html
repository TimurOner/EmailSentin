<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script type="text/javascript" src="{{ url_for('static', filename='script.js') }}"></script>
    <title>Multi-line Text Box Input</title>
</head>
<body>
    <div class="wrapper">
        <img src="static\images\head_img.png" alt="Description of the image">
        <div class="sidebar left"></div>
        <div class="container">
            <h2>Enter Text:</h2>
            <form id="input_form">
                <textarea class="text_class" id="user_input" name="user_input" placeholder="Type here..."></textarea>
                <div class="dropdown-container">
                    <div class="dropdown">
                        <h2>Choose Lexicon</h2>
                        <div class="styled-select">
                            <select id="lex_name" name="lex_name">
                                <option value="AFINN-96">AFINN-96</option>
                                <option value="AFINN-111">AFINN-111</option>
                                <option value="VADER">VADER</option>
                            </select>
                        </div>
                    </div>
                    <div class="dropdown">
                        <h2>Choose Method</h2>
                        <div class="styled-select">
                            <select id="select2" name="select2">
                                <option value="Rule Based">Rule Based</option>
                            </select>
                        </div>
                    </div>
                </div>
                <button type="button" id="submit_button">Submit</button>
            </form>
            <h2>Output:</h2>
            <textarea class="text_class" id="output" readonly></textarea>
            <h2>Parsed Email:</h2>
            <div id="email_output">
                <div> 
                    <!-- Email output content goes here -->
                </div>
            </div>
        </div>
        <div class="sidebar right"></div>
    </div>
</body>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</html>
