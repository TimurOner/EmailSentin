<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script type="text/javascript" src="{{ url_for('static', filename='script.js') }}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Multi-line Text Box Input</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
            <a class="navbar-brand" href="#">Email Sentiment Analyzer</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item active">
                        <a class="nav-link" href="#"> Home <span class="sr-only">(current)</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>
    <div class="container-fluid">
        <div class="wrapper">
            <div class="row">
                <div class="col-2 sidebar left">
                    <!-- Left Sidebar Content -->
                </div>
                <div class="col-8">
                    <h2>Enter Text:</h2>
                    <form id="input_form">
                        <textarea class="form-control text_class" id="user_input" name="user_input" placeholder="Type here..."></textarea>
                        <div class="dropdown-container">
                            <div class="dropdown">
                                <h2>Choose Lexicon</h2>
                                <div class="styled-select">
                                    <select id="lex_name" name="lex_name" class="form-select">
                                        <option value="AFINN-96">AFINN-96</option>
                                        <option value="AFINN-111">AFINN-111</option>
                                        <option value="VADER">VADER</option>
                                    </select>
                                </div>
                            </div>
                            <div class="dropdown">
                                <h2>Choose Method</h2>
                                <div class="styled-select">
                                    <select id="method_name" name="method_name" class="form-select">
                                        <option value="Rule Based">Rule Based</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <button type="button" id="submit_button" class="btn btn-primary mt-3">Submit</button>
                    </form>
                    <h2>Output:</h2>
                    <textarea class="form-control text_class" id="output" readonly></textarea>
                    <h2>Parsed Email:</h2>
                    <div id="email_output" class="border p-3 mt-3">
                        <!-- Email output content goes here -->
                    </div>
                </div>
                <div class="col-2 sidebar right">
                    
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</html>
