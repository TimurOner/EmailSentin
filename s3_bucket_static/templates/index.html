<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/style.css">
    <script type="text/javascript" src="static/script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Multi-line Text Box Input</title>
</head>
<body>
    <header style="background-color: #0d94ed !important;">
        <nav class="navbar navbar-expand-lg navbar-light fixed-top" style="background-color: #EDF0F2;">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="static/images/sent_email_logo.png" alt="Logo" style="height: 35px; margin-right: 10px;">
               
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="#">Home <span class="sr-only">(current)</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./about.html">About</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>
    
    <div class="container-fluid">
        <div class="row">
            <div class="col-2 col-sm-0 d-none d-sm-block sidebar left">
                <!-- Left Sidebar Content -->
            </div>
            <div class="col-12 col-md-8">

                
                
                <form id="input_form">

                    <div class="card" id="input_card">
                        <div class="card-body">
                            <h5 class="card-title">Your Input</h5>
                            <textarea class="form-control text_class mb-3" id="user_input" name="user_input" placeholder="Type here..." rows="5"></textarea>
                        </div>
                    </div>

                    

                        <div class="row">
                            <div class="col-md-6">
                                <div class="row">
                                    <div class="col-12 mb-3">
                                        <div class="card card_res">
                                            <div class="card-body">
                                                <h5 class="card-title">Detail Level of Analysis</h5>
                                                <div class="btn-group no-gap-buttons" role="group" aria-label="Lexicon selection">
                                                   <!-- <button type="button" class="btn btn-outline-secondary lexicon-btn" onclick="selectLexicon('AFINN-96')">AFINN-96</button> -->
                                                    <button type="button" class="btn btn-outline-secondary lexicon-btn" onclick="selectLexicon('AFINN-111')">Simple</button>
                                                    <button type="button" class="btn btn-outline-secondary lexicon-btn" onclick="selectLexicon('VADER')">Advanced</button>
                                                </div>
                                            </div>
                                        </div>
                                        <input type="hidden" id="lex_name" name="lex_name" value="AFINN-96">
                                    </div>
                
                                    <div class="col-12 mb-3">
                                        <div class="card card_res">
                                            <div class="card-body">
                                                <h5 class="card-title">What kind of Sentiment? </h5>
                                                <div class="btn-group no-gap-buttons" role="group" aria-label="Method selection">
                                                    
                                                    <button type="button" class="btn btn-outline-secondary method-btn" onclick="selectMethod('Positive-Negative')">Positive or Negative</button>
                                                    <button type="button" class="btn btn-outline-secondary method-btn" onclick="selectMethod('Formality Analysis')">Formal or Informal</button>
                                                </div>
                                            </div>
                                        </div>
                                        <input type="hidden" id="method_name" name="method_name" value="Positive-Negative">
                                    </div>
                
                                    <!-- Button with the same width as the cards -->
                                     <div class="col-12 mb-3">
                                    
                                        <button type="button" id="submit_button" class="btn btn-primary mt-3" onclick="submitForm()">Submit</button>
                                    
                                    </div>
                                </div>
                            </div>
                
                            <!-- Output and Legend Section -->
                            <div class="col-md-6">
                             
                    

                             <div class="card" id="unique-results-card">
                                 <div class="card-body">
                                     <h5 class="card-title">Results</h5>
                                     <div class="alert alert-info" role="alert">
                                        <h4 class="alert-heading" ></h4>
                                            <p>The results will be displayed here!</p>
                                        </div>
                                    </div>
                                    
                                   

                               </div>


                               <div class="star-rating" style="display: flex; flex-direction: column; align-items: center;">
                                
                                <button id="feedbackButton" type="button" class="btn btn-light" style="height: 0;">
                                    <div id="feedbackContent" style="display: none;">
                                        <p>Your Feedback</p>
                                        <fieldset class="rating">
                                            <input type="radio" id="star5" name="rating" value= 5 onclick="submitRating(this.value)" />
                                            <label class="full" for="star5" title="Awesome - 5 stars"></label>
                                            
                                            <input type="radio" id="star4half" name="rating" value=4.5 onclick="submitRating(this.value)" />
                                            <label class="half" for="star4half" title="Pretty good - 4.5 stars"></label>
                                            
                                            <input type="radio" id="star4" name="rating" value=4 onclick="submitRating(this.value)" />
                                            <label class="full" for="star4" title="Pretty good - 4 stars"></label>
                                            
                                            <input type="radio" id="star3half" name="rating" value=3.5 onclick="submitRating(this.value)" />
                                            <label class="half" for="star3half" title="Meh - 3.5 stars"></label>
                                            
                                            <input type="radio" id="star3" name="rating" value=3 onclick="submitRating(this.value)" />
                                            <label class="full" for="star3" title="Meh - 3 stars"></label>
                                            
                                            <input type="radio" id="star2half" name="rating" value=2.5 onclick="submitRating(this.value)" />
                                            <label class="half" for="star2half" title="Kinda bad - 2.5 stars"></label>
                                            
                                            <input type="radio" id="star2" name="rating" value=2 onclick="submitRating(this.value)" />
                                            <label class="full" for="star2" title="Kinda bad - 2 stars"></label>
                                            
                                            <input type="radio" id="star1half" name="rating" value=1.5 onclick="submitRating(this.value)" />
                                            <label class="half" for="star1half" title="Meh - 1.5 stars"></label>
                                            
                                            <input type="radio" id="star1" name="rating" value=1 onclick="submitRating(this.value)" />
                                            <label class="full" for="star1" title="Sucks big time - 1 star"></label>
                                            
                                            <input type="radio" id="starhalf" name="rating" value=0.5 onclick="submitRating(this.value)" />
                                            <label class="half" for="starhalf" title="Sucks big time - 0.5 stars"></label>
                                        </fieldset>
                                        
                                    </div>
                                </button>
                                
                            </div>
                                    
                            </div>
                        </div>
                    
                </form>
                

                 
               <div class="col-12 mb-3 d-flex align-items-center" style="margin-left: 15px;"> <!-- Use align-items-center -->
                    <!-- Email output occupies 80% -->
                    <pre class="form-control text_class flex-grow-1" id="email_output">Your email output will appear here...</pre>
                                                
                    <!-- Card containing the image occupies the remaining 20% -->
                    
                    <div class="slider-container"> <!-- Set this div to 20% -->
                        <img src="static/images/thumb_up.png" alt="Above Slider" id="upper_image_slider" class="slider-image above" style="transform: scale(0.5);">
                        <input type="range" class="form-range" id="sentimentRange" min="0" max="100" value="50">
                        <img src="static/images/thumb_down.png" alt="Below Slider" id="lower_image_slider" class="slider-image below" style="transform: scale(0.5);">
                        
                    </div>

                    
                    
                </div>

               
                
                
                
                
                

            </div>
            <div class="col-2 col-sm-0 d-none d-sm-block sidebar right">
                <!-- Right Sidebar Content -->
            </div>
        </div>
    </div>
    
    </div>
    
    <!-- Footer placed outside the row -->
    <footer class="footer">
        © 2025 Email Sentiment Analyzer. All rights reserved.
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-Z0U4PxsG0o3YO4HzxKogTqpgZhfwJ4i7vKhxErx0K8GoJQH8ZT0Op6h9Xy5RyEb3" crossorigin="anonymous"></script>

</body>


</html>
